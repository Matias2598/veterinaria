<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria San Marcos</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="funciones/funciones.js" defer></script>
</head>
<body>
    <header>
        <h1>Veterinaria San Marcos</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="servicios.html">Catalogo de servicios</a>
            <a href="contacto.html">Formulario de contacto</a>
            <a href="registro.html" class="activo">Registrarse</a>
        </nav>
    </header>
    <main>
      <section id="registro">
      <h2>Complete los datos para registrarse</h2>
      <form id="form-registro" novalidate>
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" required>
        <span class="error"></span>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" required>
        <span class="error"></span>

        <label for="confirmar-correo">Confirmar correo electrónico</label>
        <input type="email" id="confirmar-correo" required>
        <span class="error"></span>

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" required>
        <span class="error"></span>

        <label for="confirmar-contrasena">Confirmar contraseña</label>
        <input type="password" id="confirmar-contrasena" required>
        <span class="error"></span>

        <label for="telefono">Teléfono (opcional)</label>
        <input type="tel" id="telefono">

        <label for="region">Región</label>
        <select id="region" required>
          <option value="">Selecciona una opción</option>
          <option value="arica_y_parinacota">Arica y Parinacota</option>
          <option value="tarapaca">Tarapacá</option>
          <option value="antofagasta">Antofagasta</option>
          <option value="atacama">Atacama</option>
          <option value="coquimbo">Coquimbo</option>
          <option value="valparaiso">Valparaíso</option>
          <option value="ohiggins">O'Higgins</option>
          <option value="maule">Maule</option>
          <option value="nuble">Ñuble</option>
          <option value="biobio">Biobío</option>
          <option value="la_araucania">La Araucanía</option>
          <option value="los_rios">Los Ríos</option>
          <option value="los_lagos">Los Lagos</option>
          <option value="aysen">Aysén</option>
          <option value="magallanes">Magallanes y de la Antártica Chilena</option>
          <option value="metropolitana">Región Metropolitana de Santiago</option>
        </select>
        <span class="error"></span>

        <label for="comuna">Comuna</label>
        <select id="comuna" required>
          <option value="">Selecciona una región primero</option>
        </select>
        <span class="error"></span>

        <button type="submit">Registrarse</button>
        <p id="mensaje-confirmacion"></p>
      </form>
    </section>
    </main>

    <footer>
            <p>© 2026 Veterinaria San Marcos</p>
    </footer>
</body>
</html>
