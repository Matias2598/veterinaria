<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Veterinaria San Marcos</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="funciones/funcionContacto.js" defer></script>
</head>
<body>
    <header>
        <h1>🐾 Veterinaria San Marcos</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="productos.html">Productos</a>
            <a href="blogs.html">Blogs</a>
            <a href="contacto.html" class="activo">Contacto</a>
            <a href="carrito.html">Carrito</a>
            <a href="login.html">Iniciar sesión</a>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h2>Contáctanos</h2>
            <p>
                ¿Tienes dudas sobre nuestros servicios o productos?
                Escríbenos y te responderemos a la brevedad.
            </p>
        </section>
        <section class="formulario-contenedor">
            <h2>Formulario de contacto</h2>
            <form id="formContacto" novalidate>
                <fieldset class="campo">
                    <label for="nombre">
                        Nombre completo
                    </label>
                    <input type="text" id="nombre"
                    placeholder="Ingrese su nombre">
                    <p class="error" id="errorNombre"></p>
                </fieldset>

                <fieldset class="campo">
                    <label for="correo">
                        Correo electrónico
                    </label>
                    <input type="email" id="correo"
                    placeholder="ejemplo@gmail.com">
                    <p class="error" id="errorCorreo"></p>
                </fieldset>


                <fieldset class="campo">
                    <label for="comentario">
                        Comentario                    
                    </label>

                    <textarea id="comentario" rows="5"
                    placeholder="Escribe tu mensaje">
                    </textarea>

                    <p class="error" id="errorComentario"></p>
                </fieldset>


                <button type="submit">
                    Enviar mensaje
                </button>

                <p id="mensajeContacto"
                    class="mensaje-exito">
                </p>
            </form>
        </section>
    </main>
    <footer>
        <p>© 2026 Veterinaria San Marcos</p>
    </footer>
</body>
</html>
