<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios | Panel administrador</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="funciones-admin/regiones-data.js" defer></script>
</head>
<body class="admin-layout">
    <aside class="admin-sidebar">

        <h2 class="admin-logo">🐾 Vet. San Marcos</h2>

        <nav class="admin-nav">
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="usuarios.html" class="activo">Usuarios</a>
        </nav>

        <a href="../index.html" class="admin-salir">← Volver a la tienda</a>

    </aside>
    <section class="admin-contenido">

        <header class="admin-topbar">
            <h1>Usuarios</h1>
        </header>

        <main class="admin-main">

            <section class="admin-tabla">

                <h2>Listado de usuarios</h2>

                <table id="tablaUsuariosAdmin">

                    <thead>
                        <tr>
                            <th>RUN</th>
                            <th>Nombre</th>
                            <th>Apellidos</th>
                            <th>Correo</th>
                            <th>Tipo</th>
                            <th></th>
                        </tr>
                    </thead>
                    
                    <tbody id="cuerpoTablaUsuariosAdmin"></tbody>
                </table>
            </section>
            
            <section class="admin-formulario">

                <h2 id="tituloFormularioUsuario">Nuevo usuario</h2>

                <form id="formUsuario" novalidate>

                    <fieldset class="campo">

                        <label for="run">RUN (sin puntos ni guion)</label>

                        <input type="text" id="run" placeholder="19011022K" minlength="7" maxlength="9">

                        <p class="error" id="errorRun"></p>

                    </fieldset>


                    <fieldset class="campo">
                        <label for="nombreUsuario">Nombre</label>
                        <input type="text" id="nombreUsuario" maxlength="50">
                        <p class="error" id="errorNombreUsuario"></p>
                    </fieldset>


                    <fieldset class="campo">
                        <label for="apellidos">Apellidos</label>
                        <input type="text" id="apellidos" maxlength="100">
                        <p class="error" id="errorApellidos"></p>
                    </fieldset>

                    <fieldset class="campo">
                        <label for="correoUsuario">Correo electrónico</label>
                        <input type="email" id="correoUsuario" maxlength="100">
                        <p class="error" id="errorCorreoUsuario"></p>
                    </fieldset>


                    <fieldset class="campo">
                        <label for="fechaNacimiento">Fecha de nacimiento (opcional)</label>
                        <input type="date" id="fechaNacimiento">
                    </fieldset>


                    <fieldset class="campo">

                        <label for="tipoUsuario">Tipo de usuario</label>
                        <select id="tipoUsuario">
                            <option value="">Seleccione</option>
                            <option value="Administrador">Administrador</option>
                            <option value="Vendedor">Vendedor</option>
                            <option value="Cliente">Cliente</option>
                        </select>
                        <p class="error" id="errorTipoUsuario"></p>

                    </fieldset>


                    <fieldset class="campo">

                        <label for="region">Región</label>
                        <select id="region">
                            <option value="">Seleccione la región</option>
                        </select>
                        <p class="error" id="errorRegion"></p>
                    </fieldset>


                    <fieldset class="campo">

                        <label for="comuna">Comuna</label>

                        <select id="comuna">
                            <option value="">Seleccione la comuna</option>
                        </select>

                        <p class="error" id="errorComuna"></p>

                    </fieldset>


                    <fieldset class="campo">
                        <label for="direccion">Dirección</label>
                        <input type="text" id="direccion" maxlength="300">

                        <p class="error" id="errorDireccion"></p>

                    </fieldset>


                    <button type="submit" class="boton">
                        Guardar usuario
                    </button>

                    <button type="button" id="botonCancelarUsuario" class="boton" hidden>
                        Cancelar edición
                    </button>

                    <p class="mensaje-exito" id="mensajeUsuario"></p>

                </form>

            </section>
        </main>   
    </section>    
    
</body>
</html>
