<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de producto | Veterinaria San Marcos</title>
    <link rel="stylesheet" href="css/style.css">

    <script src="funciones/productos-data.js" defer></script>
</head>
<body>
    <header>
        <h1>🐾 Veterinaria San Marcos</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="productos.html" class="activo">Productos</a>
            <a href="blogs.html">Blogs</a>
            <a href="contacto.html">Contacto</a>
            <a href="carrito.html">Carrito</a>
            <a href="login.html">Iniciar sesión</a>
        </nav>
    </header>

    <main>

        <nav class="migas" aria-label="Ruta de navegación">
            <a href="index.html">Inicio</a> &gt;
            <a href="productos.html">Productos</a> &gt;
            <span id="migaNombre">Producto</span>
        </nav>

        <article class="detalle-producto" id="detalleProducto">

            <figure>
                <img id="imagenProducto" src="" alt="">
            </figure>

            <section class="info-producto">
                <h2 id="nombreProducto"></h2>
                <p class="precio" id="precioProducto"></p>
                <p id="descripcionProducto"></p>
                <form id="formAgregarCarrito">
                    <label for="cantidad">Cantidad:</label>
                    <input type="number" id="cantidad" name="cantidad" min="1" value="1">
                    <button type="submit">Agregar al carrito</button>
                    <p class="mensaje-exito" id="mensajeAgregado"></p>
                </form>
            </section>

        </article>
        <section class="relacionados">
            <h3>Productos relacionados</h3>
            <ul class="grid-productos" id="listaRelacionados"></ul>
        </section>

    </main>

    <footer class="footer">
        <p>© 2026 Veterinaria San Marcos</p>
    </footer>
    
</body>
</html>
