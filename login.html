<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Veterinaria San Marcos</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="funciones/login.js" defer></script>

</head>


<body>

    <header>

        <h1>🐾 Veterinaria San Marcos</h1>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="productos.html">Productos</a>
            <a href="blogs.html">Blogs</a>
            <a href="contacto.html">Contacto</a>
            <a href="carrito.html">Carrito</a>
            <a href="login.html" class="activo">Iniciar sesión</a>
        </nav>

    </header>


    <main>

        <section class="formulario-contenedor">

            <h2>Iniciar sesión</h2>

            <form id="formLogin" novalidate>

                <div class="campo">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        placeholder="ejemplo@gmail.com"
                    >

                    <p class="error" id="errorCorreo"></p>

                </div>


                <div class="campo">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                    >

                    <p class="error" id="errorPassword"></p>

                </div>


                <button type="submit">
                    Iniciar sesión
                </button>

                <p
                    id="mensajeLogin"
                    class="mensaje-exito"
                ></p>

            </form>

        </section>

    </main>


    <footer class="footer">
        <p>© 2026 Veterinaria San Marcos</p>
    </footer>

</body>

</html>
