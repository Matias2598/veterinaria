<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Producto | Veterinaria San Marcos</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/natanael.css">

    <script src="funciones/editar-producto.js" defer></script>
</head>

<body>

    <header>
        <h1>🐾 Administración Veterinaria San Marcos</h1>

        <nav>
            <a href="admin-home.html">Inicio</a>
            <a href="admin-productos.html">Productos</a>
            <a href="admin-usuarios.html">Usuarios</a>
            <a href="index.html">Volver a la tienda</a>
        </nav>
    </header>

    <main>

        <section class="formulario-contenedor">

            <h2>Editar producto</h2>

            <p>Modifica la información del producto seleccionado.</p>

            <form id="formProducto" novalidate>

                <div class="campo">
                    <label for="codigo">Código del producto</label>

                    <input
                        type="text"
                        id="codigo"
                        placeholder="Ej: PROD001"
                    >

                    <p class="error" id="errorCodigo"></p>
                </div>


                <div class="campo">
                    <label for="nombre">Nombre del producto</label>

                    <input
                        type="text"
                        id="nombre"
                        placeholder="Ej: Alimento para perros"
                    >

                    <p class="error" id="errorNombre"></p>
                </div>


                <div class="campo">
                    <label for="descripcion">Descripción</label>

                    <textarea
                        id="descripcion"
                        rows="5"
                        placeholder="Descripción del producto"
                    ></textarea>

                    <p class="error" id="errorDescripcion"></p>
                </div>


                <div class="campo">
                    <label for="precio">Precio</label>

                    <input
                        type="number"
                        id="precio"
                        min="0"
                        placeholder="Ej: 15990"
                    >

                    <p class="error" id="errorPrecio"></p>
                </div>


                <div class="campo">
                    <label for="stock">Stock disponible</label>

                    <input
                        type="number"
                        id="stock"
                        min="0"
                        placeholder="Ej: 20"
                    >

                    <p class="error" id="errorStock"></p>
                </div>


                <div class="campo">
                    <label for="stockCritico">Stock crítico</label>

                    <input
                        type="number"
                        id="stockCritico"
                        min="0"
                        placeholder="Ej: 5"
                    >

                    <p class="error" id="errorStockCritico"></p>
                </div>


                <div class="campo">
                    <label for="categoria">Categoría</label>

                    <select id="categoria">

                        <option value="">Seleccione una categoría</option>

                        <option value="alimentos">
                            Alimentos
                        </option>

                        <option value="accesorios">
                            Accesorios
                        </option>

                        <option value="higiene">
                            Higiene y cuidado
                        </option>

                        <option value="juguetes">
                            Juguetes
                        </option>

                    </select>

                    <p class="error" id="errorCategoria"></p>
                </div>


                <button type="submit">
                    Guardar cambios
                </button>

                <p
                    id="mensajeProducto"
                    class="mensaje-exito"
                ></p>

            </form>

        </section>

    </main>

    <footer class="footer">
        <p>© 2026 Veterinaria San Marcos</p>
    </footer>

</body>

</html>
