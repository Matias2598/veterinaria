<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador - Veterinaria San Marcos</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="funciones/funciones.js" defer></script>
</head>
<body>
    <header class="admin-header">
        <h1>Panel Administrador</h1>
        <nav class="admin-nav">
                <a href="admin-home.html">Inicio</a>
                <a href="admin-productos.html" class="activo">Productos</a>
                <a href="admin-usuarios.html">Usuarios</a>
        </nav>
    </header>
    <main>
        <section id="form-producto">
            <h2>Nuevo producto</h2>
            <form id="formulario-producto" novalidate>
                <label for="codigo">Código producto</label>
                <input type="text" id="codigo" required>
                <span class="error"></span>

                <label for="nombre-producto">Nombre</label>
                <input type="text" id="nombre-producto" required>
                <span class="error"></span>

                <label for="descripcion">Descripción (opcional)</label>
                <textarea id="descripcion"></textarea>

                <label for="precio">Precio</label>
                <input type="number" id="precio" min="0" step="1" required>
                <span class="error"></span>

                <label for="stock">Stock</label>
                <input type="number" id="stock" min="0" step="1" required>
                <span class="error"></span>

                <label for="stock-critico">Stock crítico (opcional)</label>
                <input type="number" id="stock-critico" min="0" step="1">

                <label for="categoria">Categoría</label>
                <select id="categoria" required>
                    <option value="">Selecciona una opción</option>
                    <option value="consultas">Consultas</option>
                    <option value="vacunacion">Vacunación</option>
                    <option value="cirugia">Cirugía</option>
                    <option value="desparasitacion">Desparasitación</option>
                    <option value="examenes">Exámenes</option>
                </select>
                <span class="error"></span>

                <label for="imagen">Imagen (opcional)</label>
                <input type="file" id="imagen">

                <button type="submit">Guardar producto</button>
                <p id="mensaje-confirmacion"></p>
            </form>
        </section>
    </main>
    <footer>
        <p>© 2026 Veterinaria San Marcos</p>
    </footer>
</body>
</html>
